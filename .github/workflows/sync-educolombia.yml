name: Sincronización Automática con EduColombia

on:
  schedule:
    # Ejecuta automáticamente cada 20 minutos de forma continua
    - cron: '*/20 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Ejecutar script de sincronización con EduColombia
        run: python scripts/sync_educolombia.py

      - name: Verificar cambios y hacer commit
        run: |
          git config --local user.email "csddigitalweb@gmail.com"
          git config --local user.name "Colegio Semillero Dos Mil (Bot)"
          git add src/reserva-cupo/prematriculas_semillero.csv src/reserva-cupo/prematriculas_hash.json
          if git diff --staged --quiet; then
            echo "No hay cambios nuevos en EduColombia."
          else
            echo "Cambios detectados. Guardando y publicando actualización..."
            git commit -m "chore(sync): actualizar cupos confirmados en vivo desde EduColombia"
            git push origin main
          fi
